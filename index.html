<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1238" />
  <meta name="description" content="小組活動綜合平台：抽獎輪盤、多項選擇、大電視動作猜估及題庫匯入工具。" />
  <title>小組活動綜合平台</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" async></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="返回首頁">
        <span class="brand-mascot" aria-hidden="true">🎪</span>
        <span>小組活動綜合平台</span>
      </button>
      <nav class="desktop-nav" aria-label="主要導覽">
        <button class="nav-link is-active" data-route="home">首頁</button>
        <button class="nav-link" data-route="wheel">抽獎輪盤</button>
        <button class="nav-link" data-route="quiz">多項選擇</button>
        <button class="nav-link" data-route="tvplay" data-prepare-tv="true">大電視</button>
        <button class="nav-link" data-route="bank">題庫管理</button>
      </nav>
      <div class="top-actions">
        <button class="icon-button" id="soundToggle" aria-label="切換音效" title="音效">
          <span aria-hidden="true">🔊</span>
        </button>
        <button class="profile-button" type="button">
          <span class="avatar">🐶</span>
          <span class="profile-copy"><small>歡迎回來</small><strong>小組隊長</strong></span>
        </button>
        <button class="menu-button" id="menuButton" aria-label="開啟選單" aria-expanded="false">☰</button>
      </div>
    </header>

    <nav class="mobile-nav" id="mobileNav" aria-label="手機導覽">
      <button data-route="home">首頁</button>
      <button data-route="wheel">抽獎輪盤</button>
      <button data-route="quiz">多項選擇</button>
      <button data-route="tvplay" data-prepare-tv="true">大電視</button>
      <button data-route="bank">題庫管理</button>
    </nav>

    <main id="viewRoot" tabindex="-1"></main>
  </div>


  <nav class="shortcut-bar" id="shortcutBar" aria-label="遊戲快捷列">
    <button class="shortcut-collapse" id="shortcutCollapse" type="button" aria-label="收起快捷鍵列" aria-expanded="true">⌄</button>
    <div class="shortcut-bar-inner">
      <div class="shortcut-label"><span class="shortcut-bolt">⚡</span><span><strong>快捷操作</strong><small>遊戲及設定</small></span></div>
      <div class="shortcut-group wheel-shortcut">
        <span class="shortcut-icon">🎡</span>
        <span class="shortcut-copy"><strong>抽獎輪盤</strong><small>名單抽選</small></span>
        <span class="shortcut-actions"><button class="shortcut-button primary" data-route="wheel">進入</button><button class="shortcut-button secondary" data-route="wheelsettings">設定</button></span>
      </div>
      <div class="shortcut-group quiz-shortcut">
        <span class="shortcut-icon">🎮</span>
        <span class="shortcut-copy"><strong>多項選擇</strong><small>計時問答</small></span>
        <span class="shortcut-actions"><button class="shortcut-button primary" data-route="quiz">進入</button><button class="shortcut-button secondary" data-route="quizsettings">設定</button></span>
      </div>
      <div class="shortcut-group tv-shortcut">
        <span class="shortcut-icon">📺</span>
        <span class="shortcut-copy"><strong>大電視</strong><small>動作猜估</small></span>
        <span class="shortcut-actions"><button class="shortcut-button primary" data-route="tvplay" data-prepare-tv="true">進入</button><button class="shortcut-button secondary" data-route="tv">設定</button></span>
      </div>
    </div>
  </nav>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-layer" id="modalLayer" aria-live="polite"></div>
</body>
</html>
